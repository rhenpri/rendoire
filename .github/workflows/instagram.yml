name: Instagram

# Runs after every successful site deploy. If that deploy generated Instagram assets for a
# new post, publish them (once the files are live on rendoire.com). Without the secrets below
# it does nothing but leave the drafts in the "ig-out" artifact of the deploy run.
#
# Setup: see scripts/instagram/README.md
#   secrets:   IG_ACCESS_TOKEN, (optional) IG_USER_ID, ANTHROPIC_API_KEY
#   variables: IG_AUTOPUBLISH=true to publish automatically, IG_FORMATS=carousel,reel

on:
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: instagram
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Fetch the drafts from the deploy run
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ig-out
          path: .instagram
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_AUTOPUBLISH: ${{ vars.IG_AUTOPUBLISH }}
          IG_FORMATS: ${{ vars.IG_FORMATS }}
          IG_API_BASE: ${{ vars.IG_API_BASE }}
          ASSET_BASE: ${{ vars.IG_ASSET_BASE || 'https://rendoire.com' }}
        run: |
          if [ ! -s .instagram/slugs.txt ]; then
            echo "No Instagram assets from this deploy."
            exit 0
          fi
          mode=$(cat .instagram/mode.txt 2>/dev/null || echo auto)
          if [ "$IG_AUTOPUBLISH" != "true" ] && [ "$mode" != "force" ]; then
            echo "Drafts are ready (artifact ig-out on the deploy run). Set the IG_AUTOPUBLISH variable to true to post automatically."
            echo "### Instagram drafts ready, not published" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for s in $(cat .instagram/slugs.txt); do
            node scripts/instagram/publish.mjs "$s" --dir ".instagram/$s" --base "${ASSET_BASE%/}/ig/$s"
          done
